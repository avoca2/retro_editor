name: retro_editor
description: Editor de imágenes retro con herramientas reales.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter95: ^1.5.0
  file_selector: ^1.0.3
  pro_image_editor: ^14.0.0
  material_ui: ^1.11.0
  path_provider: ^2.1.2
  camera: ^0.10.5+9
  universal_io: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
